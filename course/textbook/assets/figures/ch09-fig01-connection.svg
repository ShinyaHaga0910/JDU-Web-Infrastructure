<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img">
<title>WebからDBへ接続して操作する条件</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図9-1  WebからDBへ接続して操作する条件</text>
<rect x="160" y="130" width="1280" height="155" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="800" y="148" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">名前解決と接続先</text>
<text x="800" y="212" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">db.lab.test → 10.20.2.20</text>
<polyline points="800,285 800,335" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="800,335 793.0405514542203,320.5928463623572 806.9594485457797,320.5928463623572" fill="#2165a7"/>
<rect x="160" y="335" width="1280" height="155" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="800" y="353" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">通信許可・待受</text>
<text x="800" y="417" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">WebからTCPでDBサーバーの5432番ポートへ</text>
<polyline points="800,490 800,540" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="800,540 793.0405514542203,525.5928463623571 806.9594485457797,525.5928463623571" fill="#16745b"/>
<rect x="160" y="540" width="1280" height="155" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="800" y="558" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">HBAと認証</text>
<text x="800" y="622" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">DB名・ロール・送信元を照合し、定めた方式で認証</text>
<polyline points="800,695 800,745" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="800,745 793.0405514542203,730.5928463623571 806.9594485457797,730.5928463623571" fill="#9d651a"/>
<rect x="160" y="745" width="1280" height="155" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="800" y="763" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">SQL権限</text>
<text x="800" y="827" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">接続後、対象の表で許された操作を行う</text>
<text x="55" y="1010" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">パスワードは、すべての条件をまとめて満たすものではない。</text>
</svg>