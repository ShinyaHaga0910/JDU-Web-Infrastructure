<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="765" viewBox="0 0 1600 765" role="img">
<title>HTTPリクエストのリクエスト行、ヘッダー、空行、本文</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">図4-4  HTTPリクエストの構成</text>
<rect x="55" y="115" width="1490" height="142" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="85" y="135" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">① リクエスト行</text>
<text x="85" y="188" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">POST</text>
<text x="240" y="188" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">/items HTTP/1.1</text>
<text x="1045" y="190" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">POSTがメソッド</text>
<rect x="55" y="278" width="1490" height="203" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="85" y="295" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">② HTTPヘッダー</text>
<text x="85" y="345" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">Host: 203.0.113.20</text>
<text x="85" y="388" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">Content-Type: application/x-www-form-urlencoded</text>
<text x="85" y="431" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">Content-Length: 21</text>
<text x="1045" y="365" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">宛先名や本文の情報</text>
<text x="85" y="502" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">空行</text>
<rect x="55" y="555" width="1490" height="147" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="85" y="576" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">③ 本文</text>
<text x="85" y="631" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="38" dominant-baseline="text-before-edge" text-anchor="start">name=chair&amp;quantity=2</text>
<text x="1045" y="630" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">送るデータ</text>
</svg>