<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>コード・設定・データの保存先</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図12-1  コード・設定・データの保存先</text>
<text x="55" y="98" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">同じ高さの枠を一組として読む</text>
<rect x="40" y="180" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<rect x="830" y="180" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="345" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EC2 Webサーバー</text>
<text x="345" y="270" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">コードと依存パッケージ</text>
<text x="1195" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">/opt/jdu-catalog/app</text>
<text x="1195" y="270" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">/opt/jdu-catalog/venv</text>
<polyline points="650,268 830,268" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="830,268 815.5928463623571,274.9594485457797 815.5928463623571,261.0405514542203" fill="#2165a7"/>
<rect x="40" y="405" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<rect x="830" y="405" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="345" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EC2 Webサーバー</text>
<text x="345" y="495" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">秘密設定と配信用ファイル</text>
<text x="1195" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">/etc/jdu-catalog と staticを分離</text>
<text x="1195" y="495" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">秘密をHTTPの配信範囲へ置かない</text>
<polyline points="650,493 830,493" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="830,493 815.5928463623571,499.9594485457797 815.5928463623571,486.0405514542203" fill="#16745b"/>
<rect x="40" y="630" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<rect x="830" y="630" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="345" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EC2 DBサーバー</text>
<text x="345" y="720" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">PostgreSQLのデータ</text>
<text x="1195" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">備品・管理者・必要な補助データ</text>
<text x="1195" y="720" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">WebのアプリからTCP・5432番へ</text>
<polyline points="650,718 830,718" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="830,718 815.5928463623571,724.9594485457797 815.5928463623571,711.0405514542203" fill="#9d651a"/>
<text x="55" y="930" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">保存場所と、それを扱う権限を用途に合わせて分ける。</text>
</svg>