<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="645" viewBox="0 0 1600 645" role="img">
<title>同じVPCにある踏み台サーバーからWebサーバーの内部IPの80番ポートへHTTPで接続する</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">図4-6  踏み台サーバーからWebサーバーへの内部通信</text>
<rect x="45" y="91" width="1510" height="505" rx="18" fill="#f4f8fc" stroke="#7793ae" stroke-width="2"/>
<text x="75" y="106" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="75" y="162" width="1450" height="403" rx="18" fill="#ffffff" stroke="#7793ae" stroke-width="2"/>
<text x="105" y="180" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="start">VPC  10.20.0.0/16</text>
<rect x="115" y="275" width="400" height="218" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="315" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">EC2 踏み台サーバー</text>
<text x="315" y="364" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">内部IP  10.20.1.10</text>
<text x="315" y="420" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">curlを実行する端末</text>
<rect x="1085" y="275" width="400" height="218" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1285" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">EC2 Webサーバー</text>
<text x="1285" y="364" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">内部IP  10.20.1.20</text>
<text x="1285" y="420" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">TCPの80番ポート</text>
<text x="800" y="293" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">HTTPリクエスト</text>
<polyline points="515,344 1085,344" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1085,344 1070.5928463623572,350.9594485457797 1070.5928463623572,337.0405514542203" fill="#2165a7"/>
<text x="800" y="402" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">HTTPレスポンス</text>
<polyline points="1085,453 515,453" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="515,453 529.4071536376429,446.0405514542203 529.4071536376429,459.9594485457797" fill="#16745b"/>
</svg>