<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>比較結果から、次に見る範囲を選ぶ</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図14-2  比較結果から、次に見る範囲を選ぶ</text>
<text x="55" y="98" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">同じ高さの枠を一組として読む</text>
<rect x="40" y="180" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<rect x="830" y="180" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="345" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">IP指定は成功・名前は失敗</text>
<text x="1195" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">名前解決の設定と回答を比較</text>
<text x="1195" y="270" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">dig指定先と通常の経路も区別</text>
<polyline points="650,268 830,268" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="830,268 815.5928463623571,274.9594485457797 815.5928463623571,261.0405514542203" fill="#2165a7"/>
<rect x="40" y="405" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<rect x="830" y="405" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="345" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">Web自身は成功・外側は失敗</text>
<text x="1195" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">待受IP・宛先・通信許可を比較</text>
<text x="1195" y="495" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">現在の公開IPも確認</text>
<polyline points="650,493 830,493" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="830,493 815.5928463623571,499.9594485457797 815.5928463623571,486.0405514542203" fill="#16745b"/>
<rect x="40" y="630" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<rect x="830" y="630" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="345" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">静的配信は成功・アプリは失敗</text>
<text x="1195" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">アプリの起動と転送、DBを調べる</text>
<text x="1195" y="720" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">Nginxだけの成功と区別</text>
<polyline points="650,718 830,718" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="830,718 815.5928463623571,724.9594485457797 815.5928463623571,711.0405514542203" fill="#9d651a"/>
<text x="55" y="930" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">成功した範囲を基準にする。結果一つで原因を断定しない。</text>
</svg>