<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img">
<title>踏み台サーバーとWebサーバーのそれぞれのUbuntu OSで、Netplan設定ファイルに問い合わせ先DNSを書き、適用してOSのDNS設定へ反映する</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図7-3  2台それぞれのOSに、問い合わせ先DNSを設定する</text>
<rect x="35" y="110" width="1730" height="1160" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="60" y="128" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="65" y="185" width="1660" height="1045" rx="18" fill="#f3f8f5" stroke="#16745b" stroke-width="2"/>
<text x="95" y="205" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">VPC（内部ネットワーク）</text>
<rect x="110" y="275" width="750" height="905" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="485" y="295" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="485" y="341" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="485" y="402" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="150" y="465" width="670" height="270" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="485" y="484" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">① OSのネットワーク設定ファイル</text>
<text x="485" y="540" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">/etc/netplan/ 内の既存のYAML</text>
<text x="185" y="595" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">nameservers:</text>
<text x="210" y="650" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">addresses: [10.20.2.10]</text>
<polyline points="760,735 760,935" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="760,935 753.0405514542203,920.5928463623571 766.9594485457797,920.5928463623571" fill="#2165a7"/>
<text x="180" y="765" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">② 保存した設定をOSへ適用する</text>
<text x="180" y="823" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">sudo netplan generate</text>
<text x="180" y="875" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">sudo netplan apply</text>
<rect x="150" y="935" width="670" height="220" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="485" y="955" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">③ 動作中のOSのDNS設定</text>
<text x="485" y="1020" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">問い合わせ先：10.20.2.10</text>
<text x="485" y="1085" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">resolvectl dns で確認する</text>
<rect x="910" y="275" width="750" height="905" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1285" y="295" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1285" y="341" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1285" y="402" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<rect x="950" y="465" width="670" height="270" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="1285" y="484" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">① OSのネットワーク設定ファイル</text>
<text x="1285" y="540" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">/etc/netplan/ 内の既存のYAML</text>
<text x="985" y="595" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">nameservers:</text>
<text x="1010" y="650" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">addresses: [10.20.2.10]</text>
<polyline points="1560,735 1560,935" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1560,935 1553.0405514542203,920.5928463623571 1566.9594485457797,920.5928463623571" fill="#2165a7"/>
<text x="980" y="765" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">② 保存した設定をOSへ適用する</text>
<text x="980" y="823" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">sudo netplan generate</text>
<text x="980" y="875" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">sudo netplan apply</text>
<rect x="950" y="935" width="670" height="220" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="1285" y="955" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">③ 動作中のOSのDNS設定</text>
<text x="1285" y="1020" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">問い合わせ先：10.20.2.10</text>
<text x="1285" y="1085" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">resolvectl dns で確認する</text>
<text x="55" y="1295" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">設定する10.20.2.10は、内部DNSサーバーのIPアドレスである。</text>
</svg>