<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img">
<title>Webサーバー上のpsqlがDBMSのPostgreSQLへSQLを送り、PostgreSQLが管理する複数のデータベースから利用先を選ぶ</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図9-1  クライアントはDBMSを通してDBを利用する</text>
<rect x="40" y="160" width="600" height="720" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="340" y="185" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="340" y="235" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<rect x="85" y="380" width="510" height="260" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="340" y="408" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">クライアント：psql</text>
<text x="340" y="480" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">起動するとプロセスが動く</text>
<text x="340" y="550" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">SQLを送り、結果を表示する</text>
<rect x="770" y="160" width="990" height="720" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="1265" y="185" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1265" y="235" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<rect x="810" y="310" width="910" height="525" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="1265" y="332" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">DBMS：PostgreSQL</text>
<text x="1010" y="471" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">SQLを受け付ける</text>
<text x="1010" y="540" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">選んだDBを操作する</text>
<rect x="1350" y="420" width="320" height="225" rx="18" fill="#e1edf6" stroke="#2165a7" stroke-width="2"/>
<text x="1510" y="444" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">本課題用のDB</text>
<rect x="1290" y="560" width="390" height="225" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="1485" y="585" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">練習用のDB</text>
<text x="1485" y="655" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">表・備品などのデータ</text>
<text x="1485" y="717" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">接続時に使うDBを選ぶ</text>
<polyline points="640,480 810,480" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="810,480 795.5928463623571,486.9594485457797 795.5928463623571,473.0405514542203" fill="#2165a7"/>
<text x="683" y="418" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">SQL</text>
<polyline points="810,625 640,625" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="640,625 654.4071536376429,618.0405514542203 654.4071536376429,631.9594485457797" fill="#16745b"/>
<text x="683" y="660" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">結果</text>
<polyline points="1195,585 1290,635" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1290,635 1274.0095088787139,634.4484624218866 1280.492185548072,622.131376750106" fill="#16745b"/>
<text x="55" y="955" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">一台のDBサーバー上で、PostgreSQLが複数のデータベースを管理する。</text>
<text x="55" y="1020" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">Webのpsqlが送ったSQLを、DBサーバーのPostgreSQLが処理して結果を返す。</text>
</svg>