<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img">
<title>踏み台サーバーとWebサーバーの各端末から、OSの問い合わせ先を変更せずにdigで内部DNSへUDPとTCPの問い合わせを行う</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図7-2  接続元の2台から、DNSサーバーへ直接問い合わせる</text>
<rect x="35" y="110" width="1730" height="1110" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="60" y="128" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="65" y="185" width="1660" height="1000" rx="18" fill="#f3f8f5" stroke="#16745b" stroke-width="2"/>
<text x="95" y="205" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">VPC（内部ネットワーク）</text>
<rect x="110" y="275" width="640" height="400" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="430" y="293" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="430" y="338" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="430" y="398" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="150" y="455" width="560" height="180" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="430" y="470" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">端末でdigを実行</text>
<text x="430" y="522" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">dig @10.20.2.10 guide.lab.test A</text>
<text x="430" y="575" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">dig @10.20.2.10 guide.lab.test A +tcp</text>
<rect x="110" y="735" width="640" height="400" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="430" y="753" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="430" y="798" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="430" y="858" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<rect x="150" y="915" width="560" height="180" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="430" y="930" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">端末でdigを実行</text>
<text x="430" y="982" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">dig @10.20.2.10 guide.lab.test A</text>
<text x="430" y="1035" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">dig @10.20.2.10 guide.lab.test A +tcp</text>
<rect x="1220" y="430" width="470" height="670" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="1455" y="451" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1455" y="500" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="1455" y="565" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.10</text>
<text x="1455" y="635" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">UDP/TCP・53番ポート</text>
<text x="1455" y="743" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">登録したレコード</text>
<text x="1455" y="805" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">guide.lab.test</text>
<text x="1455" y="865" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">→ 10.20.1.20</text>
<polyline points="710,525 1220,525" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1220,525 1205.5928463623572,531.9594485457797 1205.5928463623572,518.0405514542203" fill="#16745b"/>
<text x="965" y="425" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">① guide.lab.test のIPv4は？</text>
<text x="965" y="473" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">DNS：UDP/TCP・53番ポート</text>
<polyline points="1220,625 710,625" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="710,625 724.4071536376429,618.0405514542203 724.4071536376429,631.9594485457797" fill="#16745b"/>
<text x="965" y="664" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">② 10.20.1.20 を回答</text>
<polyline points="710,985 1220,985" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1220,985 1205.5928463623572,991.9594485457797 1205.5928463623572,978.0405514542203" fill="#16745b"/>
<text x="965" y="885" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">① guide.lab.test のIPv4は？</text>
<text x="965" y="933" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">DNS：UDP/TCP・53番ポート</text>
<polyline points="1220,1085 710,1085" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="710,1085 724.4071536376429,1078.0405514542203 724.4071536376429,1091.9594485457797" fill="#16745b"/>
<text x="965" y="1124" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">② 10.20.1.20 を回答</text>
<text x="55" y="1240" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">それぞれのサーバーから同じ確認を行う。digの実行では、OSの普段の問い合わせ先は変わらない。</text>
</svg>