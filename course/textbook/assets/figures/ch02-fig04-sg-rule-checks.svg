<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="485" viewBox="0 0 1600 485" role="img">
<title>WebからDBへ向かう通信を送信側と受信側のSGが許可する流れ</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図2-4  DBへ接続するときのSGの判定</text>
<text x="800" y="94" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー  →  DBサーバー（10.20.2.20）</text>
<text x="800" y="145" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">TCP / 宛先ポート5432</text>
<rect x="45" y="218" width="490" height="184" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="290" y="232" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">① SG-Webの送信規則</text>
<text x="290" y="289" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">宛先がSG-DBなら許可</text>
<text x="290" y="340" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCP / 宛先ポート5432</text>
<rect x="610" y="218" width="490" height="184" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="855" y="232" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">② SG-DBの受信規則</text>
<text x="855" y="289" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">送信元がSG-Webなら許可</text>
<text x="855" y="340" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCP / 宛先ポート5432</text>
<rect x="1175" y="218" width="380" height="184" rx="18" fill="#f1f7f3" stroke="#16745b" stroke-width="2"/>
<text x="1365" y="260" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバーに届く</text>
<text x="1365" y="320" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20:5432</text>
<polyline points="535,311 610,311" fill="none" stroke="#16745b" stroke-width="5"/><polygon points="610,311 595.5928463623571,317.9594485457797 595.5928463623571,304.0405514542203" fill="#16745b"/>
<polyline points="1100,311 1175,311" fill="none" stroke="#16745b" stroke-width="5"/><polygon points="1175,311 1160.5928463623572,317.9594485457797 1160.5928463623572,304.0405514542203" fill="#16745b"/>
<text x="800" y="431" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">通信が届くには、①と②の両方の許可が必要</text>
</svg>