<text x="1240" y="588" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">接続先のOSユーザー：ssm-user</text>
<text x="40" y="682" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">矢印は操作の流れ。端末で入力したコマンドは、選んだサーバー上で実行される。</text>
