<text x="167" y="448" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<text x="167" y="496" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">AWSコンソール</text>
<text x="167" y="532" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">ログインして開始</text>
<text x="585" y="456" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">Session Manager</text>
<text x="585" y="511" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">利用者の権限を確認</text>
<polyline points="300,505 430,505" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="430,505 415.5928463623572,511.9594485457797 415.5928463623572,498.0405514542203" fill="#2165a7"/>
<rect x="840" y="460" width="250" height="96" rx="18" fill="#ffffff" stroke="#9ebed8" stroke-width="2"/>
<text x="965" y="486" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">VPCエンドポイント</text>
<rect x="1280" y="460" width="205" height="96" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1382" y="486" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">SSM Agent</text>
<polyline points="1280,505 1090,505" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1090,505 1104.4071536376428,498.0405514542203 1104.4071536376428,511.9594485457797" fill="#2165a7"/>
<polyline points="840,505 740,505" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="740,505 754.4071536376429,498.0405514542203 754.4071536376429,511.9594485457797" fill="#2165a7"/>
<text x="1175" y="461" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="middle">HTTPS / TCP 443</text>
<polyline points="1382,460 1382,359" fill="none" stroke="#2165a7" stroke-width="4" stroke-dasharray="13 9"/><polygon points="1382,359 1388.9594485457797,373.4071536376428 1375.0405514542203,373.4071536376428" fill="#2165a7"/>
<text x="1397" y="391" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="start">端末を開く</text>
<text x="40" y="674" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">緑：踏み台経由　　青：Session Manager　　矢印：接続を始める方向</text>
</svg>