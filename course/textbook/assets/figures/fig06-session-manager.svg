<text x="1150" y="229" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">SSH</text>
<text x="1110" y="324" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="start">TCP 22</text>
