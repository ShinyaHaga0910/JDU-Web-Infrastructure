<polyline points="682,270 850,270" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="850,270 835.5928463623571,276.9594485457797 835.5928463623571,263.0405514542203" fill="#16745b"/>
<text x="399" y="202" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">RDP</text>
<text x="748" y="237" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">TCP 3389</text>
<rect x="1260" y="222" width="245" height="365" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="1382" y="234" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">EC2 Webサーバー</text>
<rect x="1280" y="283" width="205" height="76" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1382" y="306" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">OSの端末</text>
