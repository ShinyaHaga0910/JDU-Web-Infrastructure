<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img">
<title>踏み台経由とSession Managerで同じWebサーバーの端末を開く</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図1-5  Webサーバーの端末を開く二つの経路</text>
<rect x="350" y="95" width="1215" height="555" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="373" y="109" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="815" y="155" width="720" height="465" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="835" y="168" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">VPC</text>
<rect x="35" y="190" width="265" height="152" rx="18" fill="#f1f7f3" stroke="#a7c2af" stroke-width="2"/>
<text x="167" y="208" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<text x="167" y="258" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">リモートデスクトップ</text>
