<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="715" viewBox="0 0 1600 715" role="img">
<title>AWSコンソールから演習の5台のうち1台を選んで端末を開く</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図1-5  AWSコンソールから開くサーバーの端末</text>
<rect x="525" y="88" width="1035" height="580" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="550" y="104" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
