<rect x="1045" y="506" width="435" height="54" rx="10" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="1070" y="515" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">EC2</text>
