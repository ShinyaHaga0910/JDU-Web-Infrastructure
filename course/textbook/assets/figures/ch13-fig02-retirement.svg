<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1340" viewBox="0 0 2400 1340" role="img">
<title>構築時と通常運用時は四角、移行時の対策は矢印形で示す。構築用の高い権限の悪用リスクと、ログイン無効化・認証情報消去・接続終了・一時設定削除を示す</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="20" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="43" dominant-baseline="text-before-edge" text-anchor="start">図13-2  構築用の強い権限を、通常運用へ残さない</text>
<rect x="40" y="210" width="620" height="870" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="350" y="240" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="43" dominant-baseline="text-before-edge" text-anchor="middle">構築時</text>
<text x="350" y="350" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">構築用の高い権限で接続</text>
<text x="350" y="440" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">表の作成・変更ができる</text>
<text x="350" y="515" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">DB・表の所有者になる</text>
<rect x="80" y="650" width="540" height="355" rx="36" fill="#fff1f2" stroke="#ad3842" stroke-width="2"/>
<text x="350" y="676" fill="#ad3842" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">接続できる状態を残すリスク</text>
<text x="350" y="760" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">認証情報を盗まれると、</text>
<text x="350" y="828" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">攻撃者にも強い操作を許す</text>
<text x="350" y="905" fill="#ad3842" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">表の変更・削除などの被害</text>
<polygon points="730,320 1480,320 1725,645 1480,970 730,970 850,645" fill="#fff1d2" stroke="#9d651a" stroke-width="3"/>
<text x="1200" y="368" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">構築用の強い権限の利用を終了</text>
<text x="1200" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">DBロールのログインを無効化</text>
<text x="1200" y="590" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">パスワードを消去</text>
<text x="1200" y="675" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">既存の構築用接続を終了</text>
<text x="1200" y="790" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">構築用の一時設定を削除</text>
<text x="1200" y="878" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">使える経路と認証情報を残さない</text>
<rect x="1770" y="210" width="590" height="870" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="2065" y="240" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="43" dominant-baseline="text-before-edge" text-anchor="middle">通常運用時</text>
<text x="2065" y="350" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">通常運用用ロールで接続</text>
<text x="2065" y="440" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">備品の閲覧・追加・変更</text>
<text x="2065" y="560" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">必要な権限だけを利用する</text>
<text x="2065" y="730" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">構築用のDBロールでは</text>
<text x="2065" y="800" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">新しい直接ログインをしない</text>
<text x="2065" y="930" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">通常の設定とデータは保持</text>
<text x="55" y="1140" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="start">今回のDB：構築用ロールはDB・表の所有者として残し、ログインを無効化する。</text>
<text x="55" y="1225" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">通常運用用ロールへ所有権を移したり、DB・表を削除したりして終了する構成ではない。</text>
</svg>