<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img">
<title>利用者PCの公開経路、踏み台の内部経路、Webサーバー自身のループバック経路を示す</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図5-4  どこからリクエストを送ったか</text>
<text x="55" y="100" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">インターネット側</text>
<rect x="540" y="145" width="1015" height="825" rx="18" fill="#f7f9fc" stroke="#7991aa" stroke-width="2"/>
<text x="565" y="163" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS VPC</text>
<rect x="40" y="290" width="380" height="150" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="230" y="313" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<text x="230" y="374" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ</text>
<rect x="590" y="280" width="360" height="170" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="770" y="306" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">Internet Gateway</text>
<text x="770" y="370" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">AWSの接続機能</text>
<rect x="1100" y="245" width="415" height="665" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="1307" y="267" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1307" y="314" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1307" y="380" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Nginx</text>
<text x="1307" y="436" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">80番ポート</text>
<polyline points="420,350 590,350" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="590,350 575.5928463623571,356.9594485457797 575.5928463623571,343.0405514542203" fill="#2165a7"/>
<polyline points="950,350 1100,350" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1100,350 1085.5928463623572,356.9594485457797 1085.5928463623572,343.0405514542203" fill="#2165a7"/>
<text x="590" y="213" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">① 公開IPを指定 ／ HTTP・TCP</text>
<rect x="590" y="550" width="360" height="180" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="770" y="568" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="770" y="613" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="770" y="671" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ・curl</text>
<text x="610" y="492" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">② 内部IP 10.20.1.20を指定</text>
<text x="978" y="568" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">HTTP</text>
<text x="983" y="610" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">TCP</text>
<polyline points="950,655 1100,655" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1100,655 1085.5928463623572,661.9594485457797 1085.5928463623572,648.0405514542203" fill="#16745b"/>
<rect x="1140" y="750" width="335" height="120" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="1307" y="768" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー自身のcurl</text>
<text x="1307" y="820" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">③ 127.0.0.1を指定</text>
<polyline points="1410,750 1410,535 1307,535 1307,485" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1307,485 1313.9594485457797,499.4071536376428 1300.0405514542203,499.4071536376428" fill="#9d651a"/>
<text x="55" y="1022" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">① 公開経路　② VPC内の経路　③ 同じWebサーバー内（HTTP・TCP）</text>
<text x="55" y="1075" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">すべてWebサーバーの80番ポートへ接続し、/example.txtをリクエストする。</text>
</svg>