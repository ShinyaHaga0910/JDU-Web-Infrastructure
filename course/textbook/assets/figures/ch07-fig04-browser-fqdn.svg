<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img">
<title>AWSのVPC内で、踏み台サーバー上のブラウザがFQDNを使い、内部DNSで得たIPのWebサーバーへHTTP接続するコンポーネント図</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図7-4  踏み台サーバーのブラウザからFQDNでアクセスする</text>
<rect x="35" y="110" width="1730" height="1090" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="60" y="127" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="65" y="185" width="1660" height="985" rx="18" fill="#f3f8f5" stroke="#16745b" stroke-width="2"/>
<text x="95" y="204" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">VPC（内部ネットワーク）</text>
<rect x="110" y="280" width="640" height="820" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="430" y="300" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="430" y="346" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="430" y="407" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="150" y="465" width="560" height="225" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="430" y="483" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ</text>
<text x="430" y="550" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">http://guide.lab.test/example.txt</text>
<rect x="150" y="820" width="560" height="200" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="430" y="843" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">OSの名前解決</text>
<text x="430" y="915" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">問い合わせ先：10.20.2.10</text>
<polyline points="430,690 430,820" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="430,820 423.0405514542203,805.5928463623571 436.9594485457797,805.5928463623571" fill="#16745b"/>
<text x="465" y="738" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">名前解決を依頼する</text>
<rect x="1220" y="290" width="470" height="380" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="1455" y="311" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1455" y="358" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1455" y="423" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<text x="1455" y="483" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">HTTP：80番ポート</text>
<polyline points="710,555 1220,555" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1220,555 1205.5928463623572,561.9594485457797 1205.5928463623572,548.0405514542203" fill="#2165a7"/>
<text x="965" y="451" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">③ HTTPリクエスト</text>
<text x="965" y="502" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCPで80番ポートへ</text>
<polyline points="1220,630 710,630" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="710,630 724.4071536376429,623.0405514542203 724.4071536376429,636.9594485457797" fill="#2165a7"/>
<text x="965" y="660" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">④ HTTPレスポンス</text>
<rect x="1220" y="820" width="470" height="280" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="1455" y="840" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1455" y="888" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="1455" y="952" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.10</text>
<text x="1455" y="1020" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">DNS：53番ポート</text>
<polyline points="710,890 1220,890" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1220,890 1205.5928463623572,896.9594485457797 1205.5928463623572,883.0405514542203" fill="#16745b"/>
<text x="965" y="777" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">① guide.lab.test のIPv4は？</text>
<text x="965" y="840" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">DNS：UDP/TCP・53番ポート</text>
<polyline points="1220,995 710,995" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="710,995 724.4071536376429,988.0405514542203 724.4071536376429,1001.9594485457797" fill="#16745b"/>
<text x="965" y="1034" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">② 10.20.1.20 を回答</text>
<text x="55" y="1220" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">緑：名前解決の通信　　青：名前解決の後に行うHTTP通信</text>
</svg>