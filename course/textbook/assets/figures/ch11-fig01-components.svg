<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1160" viewBox="0 0 2000 1160" role="img">
<title>同じWebサーバー内のNginxからGunicornへHTTPで転送し、GunicornがDjango製アプリを呼び出す。アプリが別のDBサーバーを利用する</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="38" dominant-baseline="text-before-edge" text-anchor="start">図11-1  HTTPの受付、Pythonアプリの実行、DBの分担</text>
<rect x="40" y="145" width="1390" height="820" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="735" y="170" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="735" y="222" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="38" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<rect x="90" y="450" width="380" height="300" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="280" y="477" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="39" dominant-baseline="text-before-edge" text-anchor="middle">Nginx</text>
<text x="280" y="556" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">HTTPを受け付ける</text>
<text x="280" y="637" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">80番・8080番ポート</text>
<polyline points="470,550 680,550" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="680,550 665.5928463623571,556.9594485457797 665.5928463623571,543.0405514542203" fill="#16745b"/>
<text x="570" y="425" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">HTTP転送</text>
<text x="570" y="481" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCP・8000番</text>
<polyline points="680,705 470,705" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="470,705 484.4071536376428,698.0405514542203 484.4071536376428,711.9594485457797" fill="#16745b"/>
<text x="570" y="766" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">レスポンス</text>
<rect x="680" y="340" width="690" height="540" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="1025" y="365" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="39" dominant-baseline="text-before-edge" text-anchor="middle">Gunicorn</text>
<text x="1025" y="432" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">待受：127.0.0.1:8000</text>
<text x="1025" y="504" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">WSGIの取り決めでアプリを呼び出す</text>
<rect x="735" y="580" width="580" height="235" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="1025" y="604" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">Djangoを使った提供アプリ</text>
<text x="1025" y="675" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Gunicornの処理用プロセス内で実行</text>
<text x="1025" y="740" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">DBの読み書き・HTML生成</text>
<rect x="1640" y="495" width="320" height="355" rx="18" fill="#ffffff" stroke="#9d651a" stroke-width="2"/>
<text x="1800" y="520" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1800" y="575" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="1800" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">PostgreSQL</text>
<text x="1800" y="735" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20</text>
<polyline points="1370,670 1640,670" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1640,670 1625.5928463623572,676.9594485457797 1625.5928463623572,663.0405514542203" fill="#9d651a"/>
<text x="1505" y="520" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">DB接続</text>
<text x="1505" y="577" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">TCP・5432番</text>
<polyline points="1640,780 1370,780" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1370,780 1384.4071536376428,773.0405514542203 1384.4071536376428,786.9594485457797" fill="#9d651a"/>
<text x="1505" y="817" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">結果</text>
<text x="55" y="1020" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">Djangoはアプリが利用する枠組み。Gunicornが提供アプリのコードを読み込み、実行する。</text>
<text x="55" y="1090" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="start">緑：同じWebサーバー内の連携　　茶：別のDBサーバーへの通信</text>
</svg>