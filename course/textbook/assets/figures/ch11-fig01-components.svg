<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img">
<title>Webサーバー内のNginxとアプリ、その先のDBサーバーの境界を示す</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図11-1  HTTPの入口、アプリ、DBの分担</text>
<rect x="40" y="165" width="970" height="690" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="525" y="183" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="525" y="226" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<rect x="100" y="410" width="350" height="230" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="275" y="434" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">Nginx</text>
<text x="275" y="506" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">HTTPの入口</text>
<text x="275" y="565" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">80番・8080番ポート</text>
<rect x="610" y="410" width="350" height="260" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="785" y="434" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Gunicorn</text>
<text x="785" y="496" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Djangoの提供アプリ</text>
<text x="785" y="558" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">127.0.0.1:8000</text>
<text x="785" y="615" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">一覧・保存の処理</text>
<text x="525" y="314" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">同じWebサーバー内でHTTP転送（TCP・8000番ポート）</text>
<polyline points="450,490 610,490" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="610,490 595.5928463623571,496.9594485457797 595.5928463623571,483.0405514542203" fill="#16745b"/>
<polyline points="610,597 450,597" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="450,597 464.4071536376428,590.0405514542203 464.4071536376428,603.9594485457797" fill="#16745b"/>
<rect x="1190" y="410" width="370" height="260" rx="18" fill="#ffffff" stroke="#9d651a" stroke-width="2"/>
<text x="1375" y="430" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1375" y="476" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="1375" y="542" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">PostgreSQL</text>
<text x="1375" y="606" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20</text>
<polyline points="960,490 1190,490" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1190,490 1175.5928463623572,496.9594485457797 1175.5928463623572,483.0405514542203" fill="#9d651a"/>
<polyline points="1190,597 960,597" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="960,597 974.4071536376429,590.0405514542203 974.4071536376429,603.9594485457797" fill="#9d651a"/>
<text x="1035" y="336" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">DB接続</text>
<text x="1035" y="380" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">TCP・5432番</text>
<text x="100" y="735" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">コード・アプリ実行はWebサーバー内</text>
<text x="55" y="918" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">アプリがDBへ接続する。ブラウザが直接DBへ接続する構成ではない。</text>
<text x="55" y="979" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">緑：同じWebサーバー内　　茶：別のDBサーバーへの通信</text>
</svg>