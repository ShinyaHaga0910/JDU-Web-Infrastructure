<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img">
<title>図に示したSELECT文からFROMで表、WHEREで行、SELECTで列、ORDER BYで順序を指定する対応を読む</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図8-3  このSQLで、どの行・列を取り出すか</text>
<rect x="55" y="115" width="1690" height="360" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="85" y="138" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">例に使うSQL</text>
<text x="95" y="205" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">SELECT name, quantity</text>
<text x="95" y="265" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">FROM lesson_item</text>
<text x="95" y="325" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">WHERE is_public = true</text>
<text x="95" y="385" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">ORDER BY name;</text>
<rect x="55" y="575" width="535" height="320" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="322" y="600" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">FROM lesson_item</text>
<text x="322" y="685" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">備品の表を選ぶ</text>
<text x="322" y="762" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Desk・Monitor・Keyboard</text>
<polyline points="590,755 630,755" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="630,755 615.5928463623571,761.9594485457797 615.5928463623571,748.0405514542203" fill="#2165a7"/>
<rect x="630" y="575" width="535" height="320" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="897" y="600" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">WHERE is_public = true</text>
<text x="897" y="685" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">公開する行を選ぶ</text>
<text x="897" y="762" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">DeskとKeyboard</text>
<polyline points="1165,755 1205,755" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1205,755 1190.5928463623572,761.9594485457797 1190.5928463623572,748.0405514542203" fill="#16745b"/>
<rect x="1205" y="575" width="535" height="320" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="1472" y="600" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">SELECT name, quantity</text>
<text x="1472" y="685" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">名前と数量の列を得る</text>
<text x="1472" y="762" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Desk：6、Keyboard：4</text>
<text x="55" y="965" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">ORDER BY name：得られた行を、名前の昇順に並べる。</text>
<text x="55" y="1035" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">上のSQLと同じ表・条件を例に、取り出す行と列の対応を示している。</text>
<text x="55" y="1105" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">図は考え方を順に示すもの。DB内部の実際の処理順序を規定していない。</text>
</svg>