<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="910" viewBox="0 0 1600 910" role="img">
<title>構築用接続を終え、通常用で動かす</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図13-3  構築用接続を終え、通常用で動かす</text>
<text x="55" y="100" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">左から順に、情報や処理の対応を読む</text>
<rect x="40" y="210" width="490" height="420" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="285" y="240" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">構築時</text>
<text x="285" y="330" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">setupロールを使用</text>
<text x="285" y="398" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">表と初期データを準備</text>
<text x="285" y="466" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">必要なSQL権限を設定</text>
<polyline points="530,465 575,465" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="575,465 560.5928463623571,471.9594485457797 560.5928463623571,458.0405514542203" fill="#2165a7"/>
<rect x="575" y="210" width="490" height="420" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="820" y="240" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">構築用接続の終了</text>
<text x="820" y="330" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">NOLOGIN・パスワード終了</text>
<text x="820" y="398" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">残存setup接続を終了</text>
<text x="820" y="466" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">一時setup設定を片付ける</text>
<polyline points="1065,465 1110,465" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1110,465 1095.5928463623572,471.9594485457797 1095.5928463623572,458.0405514542203" fill="#16745b"/>
<rect x="1110" y="210" width="490" height="420" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="1355" y="240" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">通常時</text>
<text x="1355" y="330" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">runtime接続で動く</text>
<text x="1355" y="398" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">必要な成功を確認</text>
<text x="1355" y="466" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">不要な操作の拒否も維持</text>
<text x="55" y="725" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">NOLOGINは新しい直接ログインを止める。既存接続は別に扱う。</text>
<text x="55" y="790" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">表やDBは保持し、通常ロールへ所有権を移して済ませない。</text>
</svg>