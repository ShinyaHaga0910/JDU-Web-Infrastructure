<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img">
<title>Nginxワーカーがディレクトリを通過し、その他のユーザーの権限でファイルを読む</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="38" dominant-baseline="text-before-edge" text-anchor="start">図5-3  Nginxワーカーがファイルを読むための権限</text>
<rect x="45" y="95" width="1510" height="475" rx="18" fill="#f7f9fc" stroke="#7991aa" stroke-width="2"/>
<text x="75" y="116" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">EC2 Webサーバー（Ubuntu OS）</text>
<rect x="80" y="254" width="340" height="184" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="250" y="278" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">Nginxワーカー</text>
<text x="250" y="350" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="37" dominant-baseline="text-before-edge" text-anchor="middle">www-data</text>
<rect x="500" y="200" width="476" height="293" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="738" y="224" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">① ディレクトリを通過</text>
<text x="738" y="298" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">/ → /var → /var/www</text>
<text x="738" y="346" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">→ /var/www/html</text>
<text x="738" y="423" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">通過に必要な権限は x</text>
<rect x="1056" y="200" width="464" height="293" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="1288" y="224" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">② ファイルを読む</text>
<text x="1288" y="294" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">example.txt</text>
<text x="1288" y="351" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">root:root ／ 0644</text>
<text x="1288" y="423" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">最後の 4 ＝ 読み取り（r）</text>
<polyline points="420,346 500,346" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="500,346 485.5928463623572,352.9594485457797 485.5928463623572,339.0405514542203" fill="#2165a7"/>
<polyline points="976,346 1056,346" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1056,346 1041.5928463623572,352.9594485457797 1041.5928463623572,339.0405514542203" fill="#16745b"/>
</svg>