<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img">
<title>URLの通信方式・接続先Webサーバー・ポート番号・リクエスト対象を対応付ける</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図4-1  URLで指定する四つの部分</text>
<rect x="45" y="145" width="320" height="130" rx="18" fill="#f5f7fa" stroke="#2165a7" stroke-width="2"/>
<text x="205.0" y="180" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="41" dominant-baseline="text-before-edge" text-anchor="middle">http://</text>
<polyline points="205.0,275 205.0,380" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="205.0,380 198.04055145422032,365.5928463623572 211.95944854577968,365.5928463623572" fill="#2165a7"/>
<rect x="45" y="380" width="320" height="230" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="205.0" y="404" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">通信方式</text>
<text x="205.0" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">HTTPでリクエストを送る</text>
<rect x="420" y="145" width="400" height="130" rx="18" fill="#f5f7fa" stroke="#16745b" stroke-width="2"/>
<text x="620.0" y="180" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="41" dominant-baseline="text-before-edge" text-anchor="middle">203.0.113.20</text>
<polyline points="620.0,275 620.0,380" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="620.0,380 613.0405514542203,365.5928463623572 626.9594485457797,365.5928463623572" fill="#16745b"/>
<rect x="420" y="380" width="400" height="230" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="620.0" y="404" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">接続先Webサーバー</text>
<text x="620.0" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">公開IPの例</text>
<rect x="875" y="145" width="240" height="130" rx="18" fill="#f5f7fa" stroke="#9d651a" stroke-width="2"/>
<text x="995.0" y="180" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="41" dominant-baseline="text-before-edge" text-anchor="middle">:80</text>
<polyline points="995.0,275 995.0,380" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="995.0,380 988.0405514542203,365.5928463623572 1001.9594485457797,365.5928463623572" fill="#9d651a"/>
<rect x="875" y="380" width="240" height="230" rx="18" fill="#ffffff" stroke="#9d651a" stroke-width="2"/>
<text x="995.0" y="404" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">ポート番号</text>
<text x="995.0" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">80番ポート</text>
<rect x="1170" y="145" width="385" height="130" rx="18" fill="#f5f7fa" stroke="#2165a7" stroke-width="2"/>
<text x="1362.5" y="180" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="41" dominant-baseline="text-before-edge" text-anchor="middle">/example.txt</text>
<polyline points="1362.5,275 1362.5,380" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1362.5,380 1355.5405514542203,365.5928463623572 1369.4594485457797,365.5928463623572" fill="#2165a7"/>
<rect x="1170" y="380" width="385" height="230" rx="18" fill="#ffffff" stroke="#2165a7" stroke-width="2"/>
<text x="1362.5" y="404" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">リクエストする対象のパス</text>
<text x="1362.5" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">説明用のファイル</text>
<text x="55" y="675" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">どの通信方式で、どのWebサーバーの、何番ポートへ、何をリクエストするかを指定する。</text>
<text x="55" y="739" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">HTTPのURLでは、ポート番号を省略すると通常は80番ポートを使う。</text>
<text x="55" y="796" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">203.0.113.20は説明用の公開IP。実際には対象環境の公開IPを使う。</text>
</svg>