<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img">
<title>SYN、SYN＋ACK、ACKの後にHTTPリクエストとレスポンスを送る</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">図4-2  スリーウェイハンドシェイクとHTTP</text>
<rect x="105" y="98" width="350" height="90" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="280" y="125" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">利用者PCのブラウザ</text>
<rect x="1120" y="98" width="400" height="90" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1320" y="125" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバーの80番ポート</text>
<rect x="240" y="205" width="1120" height="340" rx="18" fill="#fff8ed" stroke="#e5cfae" stroke-width="2"/>
<rect x="240" y="563" width="1120" height="266" rx="18" fill="#f0f7ff" stroke="#c3d7ea" stroke-width="2"/>
<polyline points="280,188 280,809" fill="none" stroke="#91a1b2" stroke-width="2" stroke-dasharray="13 9"/><polygon points="280,809 273.0405514542203,794.5928463623571 286.9594485457797,794.5928463623571" fill="#91a1b2"/>
<polyline points="1320,188 1320,809" fill="none" stroke="#91a1b2" stroke-width="2" stroke-dasharray="13 9"/><polygon points="1320,809 1313.0405514542203,794.5928463623571 1326.9594485457797,794.5928463623571" fill="#91a1b2"/>
<text x="315" y="223" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">TCP接続を確立</text>
<text x="800" y="270" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">① SYN</text>
<polyline points="280,315 1320,315" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1320,315 1305.5928463623572,321.9594485457797 1305.5928463623572,308.0405514542203" fill="#9d651a"/>
<text x="800" y="362" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">② SYN＋ACK</text>
<polyline points="1320,407 280,407" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="280,407 294.4071536376428,400.0405514542203 294.4071536376428,413.9594485457797" fill="#9d651a"/>
<text x="800" y="454" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">③ ACK</text>
<polyline points="280,499 1320,499" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1320,499 1305.5928463623572,505.9594485457797 1305.5928463623572,492.0405514542203" fill="#9d651a"/>
<text x="315" y="582" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">HTTPのやり取り</text>
<text x="800" y="632" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">リクエスト   GET /example.txt HTTP/1.1</text>
<polyline points="280,679 1320,679" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1320,679 1305.5928463623572,685.9594485457797 1305.5928463623572,672.0405514542203" fill="#2165a7"/>
<text x="800" y="724" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">レスポンス   HTTP/1.1 200 OK ＋ ヘッダーと本文</text>
<polyline points="1320,771 280,771" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="280,771 294.4071536376428,764.0405514542203 294.4071536376428,777.9594485457797" fill="#2165a7"/>
</svg>