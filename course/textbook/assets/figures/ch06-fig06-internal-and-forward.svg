<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1740" viewBox="0 0 1800 1740" role="img">
<title>今回のAWS VPCとインターネットの境界を分け、内部DNSからAWS提供DNSを使って公開DNSの情報を調べる流れ</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図6-6  VPC内の問い合わせと、インターネットの公開DNS</text>
<rect x="35" y="125" width="1730" height="1235" rx="18" fill="#f6f8fb" stroke="#7991aa" stroke-width="2"/>
<text x="60" y="145" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">AWS（今回利用する環境）</text>
<rect x="70" y="215" width="1660" height="1010" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="100" y="240" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="start">今回のVPC：10.20.0.0/16</text>
<rect x="110" y="390" width="400" height="210" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="310" y="411" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="310" y="462" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="310" y="532" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="830" y="340" width="800" height="425" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="1230" y="360" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1230" y="409" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー（内部DNS）</text>
<text x="1230" y="471" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.10</text>
<text x="1230" y="552" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">内部名：自分の登録情報から答える</text>
<text x="1230" y="614" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">web.lab.test → 10.20.1.20</text>
<text x="1230" y="693" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">外部名：キャッシュ、または転送先を使う</text>
<polyline points="510,475 830,475" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="830,475 815.5928463623571,481.9594485457797 815.5928463623571,468.0405514542203" fill="#16745b"/>
<polyline points="830,555 510,555" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="510,555 524.4071536376429,548.0405514542203 524.4071536376429,561.9594485457797" fill="#16745b"/>
<text x="538" y="351" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">DNS：UDP/TCP</text>
<text x="538" y="405" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">53番ポート</text>
<text x="100" y="832" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">google.com を調べるとき</text>
<text x="100" y="903" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">① 踏み台から内部DNSへ尋ねる</text>
<text x="100" y="968" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">② 内部DNSがAWSのDNSを使う</text>
<text x="100" y="1033" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">③ 得られたIPを踏み台へ返す</text>
<text x="100" y="1133" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">WebサイトへのHTTPS接続は別の通信</text>
<circle cx="1230" cy="1020" r="160" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1230" y="916" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">AWS提供の</text>
<text x="1230" y="972" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">DNS機能</text>
<text x="1230" y="1035" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">10.20.0.2</text>
<text x="1230" y="1095" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">転送先DNS</text>
<polyline points="1180,765 1180,868" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1180,868 1173.0405514542203,853.5928463623571 1186.9594485457797,853.5928463623571" fill="#2165a7"/>
<polyline points="1280,868 1280,765" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1280,765 1286.9594485457797,779.4071536376429 1273.0405514542203,779.4071536376429" fill="#2165a7"/>
<text x="742" y="790" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">DNS：53番ポート</text>
<text x="742" y="843" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">UDP/TCP</text>
<rect x="70" y="1435" width="1660" height="220" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="900" y="1453" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="37" dominant-baseline="text-before-edge" text-anchor="middle">インターネット</text>
<text x="900" y="1525" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">公開DNS：google.com などの公開名の情報</text>
<text x="900" y="1590" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">AWSのDNS機能が、必要な公開情報を調べる</text>
<polyline points="1150,1159 1150,1435" fill="none" stroke="#2165a7" stroke-width="4" stroke-dasharray="13 9"/><polygon points="1150,1435 1143.0405514542203,1420.5928463623572 1156.9594485457797,1420.5928463623572" fill="#2165a7"/>
<polyline points="1350,1435 1350,1120" fill="none" stroke="#2165a7" stroke-width="4" stroke-dasharray="13 9"/><polygon points="1350,1120 1356.9594485457797,1134.4071536376428 1343.0405514542203,1134.4071536376428" fill="#2165a7"/>
<text x="75" y="1270" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">破線：AWSのDNS機能による、公開DNSへの問い合わせと回答</text>
<text x="55" y="1685" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">名前解決に成功しても、得たIPへのHTTP・HTTPS接続が許可されるとは限らない。</text>
</svg>