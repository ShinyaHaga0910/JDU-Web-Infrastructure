<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img">
<title>SSHのCLI操作とRDPのGUI操作の比較</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図1-2  SSHとRDPによる操作の比較</text>
<rect x="40" y="90" width="740" height="670" rx="18" fill="#f8fafc" stroke="#a9b8c7" stroke-width="2"/>
<text x="70" y="108" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">SSH：端末でCLI操作</text>
<rect x="820" y="90" width="740" height="670" rx="18" fill="#f8fafc" stroke="#a9b8c7" stroke-width="2"/>
<text x="850" y="108" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">RDP：デスクトップでGUI操作</text>
<rect x="85" y="175" width="650" height="70" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="410" y="191" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">管理用の踏み台</text>
<rect x="865" y="175" width="650" height="70" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1190" y="191" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<polyline points="410,245 410,325" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="410,325 403.0405514542203,310.5928463623572 416.9594485457797,310.5928463623572" fill="#16745b"/>
<text x="435" y="265" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">SSH / TCP22</text>
<polyline points="1190,245 1190,325" fill="none" stroke="#16745b" stroke-width="4" stroke-dasharray="13 9"/><polygon points="1190,325 1183.0405514542203,310.5928463623572 1196.9594485457797,310.5928463623572" fill="#16745b"/>
<text x="1215" y="265" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">RDP / TCP3389</text>
<rect x="85" y="325" width="650" height="360" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="410" y="340" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="410" y="380" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<rect x="865" y="325" width="650" height="360" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="1190" y="340" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1190" y="380" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<rect x="120" y="435" width="580" height="195" rx="8" fill="#193047" stroke="#193047" stroke-width="2"/>
<text x="145" y="457" fill="#ffffff" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">ubuntu@web:~$ hostname</text>
<text x="145" y="501" fill="#ffffff" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">web</text>
<text x="145" y="545" fill="#ffffff" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">ubuntu@web:~$ pwd</text>
<text x="145" y="589" fill="#ffffff" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">/home/ubuntu</text>
<rect x="900" y="435" width="580" height="195" rx="8" fill="#f0ecfa" stroke="#b3a4ce" stroke-width="2"/>
<rect x="900" y="435" width="580" height="36" rx="8" fill="#ddd5ed" stroke="#b3a4ce" stroke-width="2"/>
<text x="920" y="440" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="start">Ubuntu デスクトップ</text>
<rect x="925" y="492" width="145" height="65" rx="8" fill="#ffffff" stroke="#b3a4ce" stroke-width="2"/>
<text x="997" y="509" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">ファイル</text>
<rect x="1110" y="492" width="145" height="65" rx="8" fill="#ffffff" stroke="#b3a4ce" stroke-width="2"/>
<text x="1182" y="509" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ</text>
<rect x="1295" y="492" width="145" height="65" rx="8" fill="#ffffff" stroke="#b3a4ce" stroke-width="2"/>
<text x="1367" y="509" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="22" dominant-baseline="text-before-edge" text-anchor="middle">端末</text>
<text x="925" y="587" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">アイコンやボタンをマウスで操作</text>
<text x="70" y="709" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">文字のコマンドを入力して操作する</text>
<text x="850" y="709" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">画面のボタンやアイコンを操作する</text>
<text x="50" y="790" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">今回の使い方を比較したイメージ。RDPのデスクトップ内でも端末を使える。</text>
</svg>