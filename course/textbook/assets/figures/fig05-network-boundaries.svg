<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img">
<title>VPCの公開・非公開サブネットと通信許可の例</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="start">図1-4  公開・非公開サブネットと通信の許可</text>
<rect x="40" y="100" width="300" height="135" rx="18" fill="#f5f7fa" stroke="#a9b8c7" stroke-width="2"/>
<text x="190" y="120" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<text x="190" y="167" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">インターネット側</text>
<rect x="400" y="80" width="1150" height="980" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="425" y="94" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="850" y="125" width="360" height="130" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1030" y="143" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">Internet Gateway</text>
<text x="1030" y="189" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">VPCとInternetの接続</text>
<rect x="440" y="300" width="1060" height="730" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="470" y="315" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">VPC（Virtual Private Cloud）</text>
<rect x="480" y="380" width="980" height="220" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="500" y="393" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">公開サブネット</text>
<rect x="480" y="680" width="980" height="340" rx="18" fill="#f1f7f3" stroke="#a7c2af" stroke-width="2"/>
<text x="500" y="695" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">非公開サブネット</text>
<rect x="770" y="435" width="300" height="135" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="920" y="446" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="920" y="485" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="920" y="530" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="21" dominant-baseline="text-before-edge" text-anchor="middle">SG-Web</text>
<rect x="1070" y="730" width="300" height="125" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1220" y="739" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1220" y="776" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="1220" y="821" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="middle">SG-DB</text>
<rect x="510" y="870" width="300" height="125" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="660" y="879" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="660" y="916" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="660" y="961" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="middle">SG-DNS</text>
<rect x="1070" y="870" width="300" height="125" rx="18" fill="#ffffff" stroke="#a9b8c7" stroke-width="2"/>
<text x="1220" y="879" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1220" y="916" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">配布サーバー</text>
<text x="1220" y="961" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="20" dominant-baseline="text-before-edge" text-anchor="middle">SG-Repo</text>
<polyline points="340,165 850,165" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="850,165 835.5928463623571,171.95944854577968 835.5928463623571,158.04055145422032" fill="#2165a7"/>
<text x="495" y="126" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">HTTP / TCP80</text>
<polyline points="1210,190 1490,190 1490,495 1070,495" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1070,495 1084.4071536376428,488.0405514542203 1084.4071536376428,501.9594485457797" fill="#2165a7"/>
<text x="1230" y="250" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">HTTP / TCP80</text>
<polyline points="920,570 920,640 1220,640 1220,730" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1220,730 1213.0405514542203,715.5928463623571 1226.9594485457797,715.5928463623571" fill="#2165a7"/>
<text x="940" y="605" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">SG-DB：WebサーバーからのTCP5432を許可</text>
<polyline points="810,935 1070,935" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1070,935 1055.5928463623572,941.9594485457797 1055.5928463623572,928.0405514542203" fill="#2165a7"/>
<text x="825" y="882" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">SG-Repoで許可</text>
<text x="850" y="970" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">TCP80</text>
<polyline points="340,215 380,215 380,805 1020,805" fill="none" stroke="#ac3747" stroke-width="4" stroke-dasharray="13 9"/><polygon points="1020,805 1005.5928463623571,811.9594485457797 1005.5928463623571,798.0405514542203" fill="#ac3747"/>
<text x="990" y="769" fill="#ac3747" font-family="Noto Sans JP, sans-serif" font-size="51" dominant-baseline="text-before-edge" text-anchor="middle">×</text>
<text x="45" y="306" fill="#ac3747" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">インターネットから</text>
<text x="45" y="350" fill="#ac3747" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">DBへ直接接続不可</text>
<text x="50" y="1092" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">青：許可する通信の例　　赤と×：直接接続できない　　VPC内でもSGの許可が必要</text>
</svg>