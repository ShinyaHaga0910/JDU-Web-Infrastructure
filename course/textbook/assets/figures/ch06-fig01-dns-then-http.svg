<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img">
<title>踏み台サーバーがDNSサーバーへ名前を尋ねた後、WebサーバーへHTTPで接続する時系列</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図6-1  DNSでIPを調べてから、HTTPでページを取得する</text>
<rect x="40" y="115" width="400" height="170" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="240.0" y="132" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="240.0" y="176" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="240.0" y="238" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="600" y="115" width="400" height="170" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="800.0" y="132" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="800.0" y="176" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="800.0" y="238" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.10</text>
<rect x="1160" y="115" width="400" height="170" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="1360.0" y="132" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1360.0" y="176" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1360.0" y="238" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<polyline points="240,285 240,1090" fill="none" stroke="#9babbc" stroke-width="2" stroke-dasharray="13 9"/><polygon points="240,1090 233.04055145422032,1075.5928463623572 246.95944854577968,1075.5928463623572" fill="#9babbc"/>
<polyline points="800,285 800,650" fill="none" stroke="#9babbc" stroke-width="2" stroke-dasharray="13 9"/><polygon points="800,650 793.0405514542203,635.5928463623571 806.9594485457797,635.5928463623571" fill="#9babbc"/>
<polyline points="1360,285 1360,1090" fill="none" stroke="#9babbc" stroke-width="2" stroke-dasharray="13 9"/><polygon points="1360,1090 1353.0405514542203,1075.5928463623572 1366.9594485457797,1075.5928463623572" fill="#9babbc"/>
<text x="520" y="326" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">① web.lab.test のIPv4は？</text>
<text x="520" y="379" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">DNS：UDPまたはTCPで53番ポートへ</text>
<polyline points="240,445 800,445" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="800,445 785.5928463623571,451.9594485457797 785.5928463623571,438.0405514542203" fill="#16745b"/>
<text x="520" y="505" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">② 10.20.1.20 と回答する</text>
<polyline points="800,580 240,580" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="240,580 254.40715363764284,573.0405514542203 254.40715363764284,586.9594485457797" fill="#16745b"/>
<text x="800" y="697" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">③ 得たIPのWebサーバーの80番ポートへTCPで接続する</text>
<text x="800" y="754" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">HTTPリクエスト：GET /example.txt</text>
<polyline points="240,825 1360,825" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1360,825 1345.5928463623572,831.9594485457797 1345.5928463623572,818.0405514542203" fill="#2165a7"/>
<text x="800" y="905" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">④ WebサーバーがHTTPレスポンスを返す</text>
<polyline points="1360,990 240,990" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="240,990 254.40715363764284,983.0405514542203 254.40715363764284,996.9594485457797" fill="#2165a7"/>
<text x="55" y="1132" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">緑：名前とIPの情報を得る通信　　青：ページを取得する通信</text>
<text x="55" y="1195" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">上から下へ読む。DNSサーバーがHTTPのページを中継する構成ではない。</text>
</svg>