<text x="687" y="368" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">③ SSH接続した端末</text>
<text x="490" y="447" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">Webにコマンドを送る</text>
<text x="490" y="503" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">Webの結果を表示する</text>
<text x="140" y="665" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">ブラウザも端末も、踏み台のデスクトップの中にある。</text>
