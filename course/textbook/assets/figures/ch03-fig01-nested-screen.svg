<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img">
<title>手元のPCの画面内にRDPのデスクトップとSSH端末が入れ子で表示される</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図3-1  手元のPCの中に見える、接続先の操作画面</text>
<rect x="25" y="120" width="975" height="735" rx="18" fill="#dce3eb" stroke="#60748a" stroke-width="2"/>
