<text x="603" y="195" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">8000</text>
<polyline points="1175,315 1280,315" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1280,315 1265.5928463623572,321.9594485457797 1265.5928463623572,308.0405514542203" fill="#2165a7"/>
