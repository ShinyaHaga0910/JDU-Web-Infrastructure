<text x="340" y="466" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">DB名はWebサーバーが内部DNSで解決する。</text>
<text x="50" y="552" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">要求：ブラウザ → Nginx → アプリ → DB　　結果：同じ経路を逆向きに返す。</text>
<text x="50" y="603" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">数値はTCPのポート。IGW等の経路、DNS、管理8080、静的資源は省略。</text>
