<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>VPCと二つのサブネットに配置した5台の内部IP</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図2-1  VPCとサブネットのアドレス</text>
<rect x="35" y="95" width="1530" height="810" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="70" y="116" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">VPC  10.20.0.0/16</text>
<text x="70" y="166" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">10.20で始まる範囲に、今回のサーバーを配置する。</text>
<rect x="75" y="240" width="1450" height="260" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="100" y="257" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">公開サブネット  10.20.1.0/24</text>
<text x="100" y="301" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">10.20.1で始まる範囲</text>
<rect x="300" y="345" width="400" height="150" rx="18" fill="#ffffff" stroke="#607f9f" stroke-width="2"/>
<text x="500.0" y="357" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="500.0" y="392" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="500.0" y="439" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<text x="500.0" y="469" fill="#536a80" font-family="Noto Sans JP, sans-serif" font-size="19" dominant-baseline="text-before-edge" text-anchor="middle">SG-Bastion</text>
<rect x="900" y="345" width="400" height="150" rx="18" fill="#ffffff" stroke="#607f9f" stroke-width="2"/>
<text x="1100.0" y="357" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1100.0" y="392" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1100.0" y="439" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<text x="1100.0" y="469" fill="#536a80" font-family="Noto Sans JP, sans-serif" font-size="19" dominant-baseline="text-before-edge" text-anchor="middle">SG-Web</text>
<rect x="75" y="550" width="1450" height="300" rx="18" fill="#f1f7f3" stroke="#a7c2af" stroke-width="2"/>
<text x="100" y="568" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">非公開サブネット  10.20.2.0/24</text>
<text x="100" y="611" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">10.20.2で始まる範囲</text>
<rect x="120" y="675" width="400" height="150" rx="18" fill="#ffffff" stroke="#607f9f" stroke-width="2"/>
<text x="320.0" y="687" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="320.0" y="722" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="320.0" y="769" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.10</text>
<text x="320.0" y="799" fill="#536a80" font-family="Noto Sans JP, sans-serif" font-size="19" dominant-baseline="text-before-edge" text-anchor="middle">SG-DNS</text>
<rect x="600" y="675" width="400" height="150" rx="18" fill="#ffffff" stroke="#607f9f" stroke-width="2"/>
<text x="800.0" y="687" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="800.0" y="722" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="800.0" y="769" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20</text>
<text x="800.0" y="799" fill="#536a80" font-family="Noto Sans JP, sans-serif" font-size="19" dominant-baseline="text-before-edge" text-anchor="middle">SG-DB</text>
<rect x="1080" y="675" width="400" height="150" rx="18" fill="#ffffff" stroke="#607f9f" stroke-width="2"/>
<text x="1280.0" y="687" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1280.0" y="722" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">配布サーバー</text>
<text x="1280.0" y="769" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.30</text>
<text x="1280.0" y="799" fill="#536a80" font-family="Noto Sans JP, sans-serif" font-size="19" dominant-baseline="text-before-edge" text-anchor="middle">SG-Repo</text>
<text x="55" y="940" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">/16や/24はアドレスの範囲を表す。各サーバーへは、その内部IPを指定して接続する。</text>
</svg>