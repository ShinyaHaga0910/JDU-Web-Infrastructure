<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>VPC内の踏み台サーバーからWebサーバーへHTTPで接続し、Nginxが保存済みファイルを返す</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図5-1  保存したファイルをNginxが返す</text>
<text x="55" y="94" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">VPC内の通信と、Webサーバー内の処理</text>
<rect x="40" y="310" width="380" height="270" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="230" y="338" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="230" y="386" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="230" y="452" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ</text>
<text x="230" y="518" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<rect x="820" y="180" width="730" height="650" rx="18" fill="#f7f9fc" stroke="#7991aa" stroke-width="2"/>
<text x="1185" y="194" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1185" y="237" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="33" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1185" y="291" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">内部IP：10.20.1.20</text>
<rect x="880" y="335" width="610" height="145" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1185" y="353" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">Nginx</text>
<text x="1185" y="412" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">80番ポートでHTTPを受け付ける</text>
<text x="617" y="290" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">① GET /example.txt</text>
<text x="617" y="340" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">TCPで80番ポートへ</text>
<polyline points="420,400 880,400" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="880,400 865.5928463623571,406.9594485457797 865.5928463623571,393.0405514542203" fill="#2165a7"/>
<text x="502" y="545" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">④ HTTPレスポンス</text>
<text x="502" y="597" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">本文を受け取る</text>
<polyline points="880,465 770,465 770,510 420,510" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="420,510 434.4071536376428,503.0405514542203 434.4071536376428,516.9594485457797" fill="#2165a7"/>
<rect x="880" y="660" width="610" height="125" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="1185" y="681" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">/var/www/html/example.txt</text>
<text x="1185" y="736" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">保存済みの文章</text>
<polyline points="930,480 930,660" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="930,660 923.0405514542203,645.5928463623571 936.9594485457797,645.5928463623571" fill="#16745b"/>
<text x="975" y="523" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">② ファイルを読む</text>
<polyline points="1400,660 1400,480" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1400,480 1406.9594485457797,494.4071536376428 1393.0405514542203,494.4071536376428" fill="#16745b"/>
<text x="1160" y="586" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">③ 内容を返す</text>
<text x="55" y="882" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">青：サーバー間のHTTP通信　　緑：Webサーバー内のファイル読み取り</text>
<text x="55" y="944" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">Nginxと配信用ファイルは、同じEC2 Webサーバーの中にある。</text>
</svg>