<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img">
<title>内部DNSはlab.testのゾーン情報から答え、外部名はキャッシュを確認してAWSの転送先DNSを使う</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図6-5  内部名と外部名で、情報を調べる場所を分ける</text>
<text x="55" y="98" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">今回のAWS VPC内の名前解決</text>
<rect x="40" y="370" width="380" height="240" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="230" y="391" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="230" y="435" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="230" y="497" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.10</text>
<text x="230" y="554" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">名前を尋ねる側</text>
<rect x="595" y="180" width="550" height="780" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="870" y="200" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="870" y="247" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="middle">DNSサーバー</text>
<text x="870" y="305" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">問い合わせ先：10.20.2.10</text>
<polyline points="420,470 595,470" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="595,470 580.5928463623571,476.9594485457797 580.5928463623571,463.0405514542203" fill="#16745b"/>
<text x="432" y="375" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">DNS</text>
<text x="432" y="420" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="start">53番ポート</text>
<polyline points="595,535 420,535" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="420,535 434.4071536376428,528.0405514542203 434.4071536376428,541.9594485457797" fill="#16745b"/>
<text x="635" y="386" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">内部名：web.lab.test</text>
<text x="635" y="451" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">lab.testゾーンの情報から答える</text>
<text x="635" y="524" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">10.20.1.20 を回答する</text>
<text x="635" y="663" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">外部名：aws.amazon.com</text>
<text x="635" y="724" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">使えるキャッシュがあれば答える</text>
<text x="635" y="785" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">なければ転送先DNSへ尋ねる</text>
<text x="635" y="882" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">得た結果を踏み台サーバーへ返す</text>
<circle cx="1395" cy="775" r="175" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1395" y="671" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">AWS提供の</text>
<text x="1395" y="728" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DNS機能</text>
<text x="1395" y="789" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">10.20.0.2</text>
<text x="1395" y="852" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">転送先DNS</text>
<polyline points="1145,750 1220,750" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1220,750 1205.5928463623572,756.9594485457797 1205.5928463623572,743.0405514542203" fill="#2165a7"/>
<polyline points="1220,820 1145,820" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1145,820 1159.4071536376428,813.0405514542203 1159.4071536376428,826.9594485457797" fill="#2165a7"/>
<text x="1270" y="521" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">DNS：53番ポート</text>
<text x="55" y="1026" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">どちらも、まず内部DNSの10.20.2.10へ問い合わせる。DNSはUDPとTCPを使う。</text>
<text x="55" y="1090" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">AWS提供のDNS機能を、別のEC2として構築するわけではない。</text>
</svg>