<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1560" viewBox="0 0 2020 1560" role="img">
<title>DBから備品を読み、一覧を表示する</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="39" dominant-baseline="text-before-edge" text-anchor="start">図10-3  DBから備品を読み、一覧を表示する</text>
<rect x="45" y="140" width="360" height="1350" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<rect x="475" y="140" width="900" height="1350" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<rect x="1450" y="140" width="525" height="1350" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="225" y="160" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">一般利用者のPC</text>
<text x="925" y="160" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">EC2 Webサーバー</text>
<text x="1712" y="160" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">EC2 DBサーバー</text>
<text x="225" y="240" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">ブラウザ</text>
<polyline points="225,350 225,1450" fill="none" stroke="#bcc9d6" stroke-width="2" stroke-dasharray="13 9"/><polygon points="225,1450 218.04055145422032,1435.5928463623572 231.95944854577968,1435.5928463623572" fill="#bcc9d6"/>
<text x="650" y="240" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">Nginx</text>
<polyline points="650,350 650,1450" fill="none" stroke="#bcc9d6" stroke-width="2" stroke-dasharray="13 9"/><polygon points="650,1450 643.0405514542203,1435.5928463623572 656.9594485457797,1435.5928463623572" fill="#bcc9d6"/>
<text x="1160" y="240" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">Gunicorn</text>
<polyline points="1160,350 1160,1450" fill="none" stroke="#bcc9d6" stroke-width="2" stroke-dasharray="13 9"/><polygon points="1160,1450 1153.0405514542203,1435.5928463623572 1166.9594485457797,1435.5928463623572" fill="#bcc9d6"/>
<text x="1712" y="240" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="middle">PostgreSQL</text>
<polyline points="1712,350 1712,1450" fill="none" stroke="#bcc9d6" stroke-width="2" stroke-dasharray="13 9"/><polygon points="1712,1450 1705.0405514542203,1435.5928463623572 1718.9594485457797,1435.5928463623572" fill="#bcc9d6"/>
<text x="1160" y="300" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Django製アプリを実行</text>
<polyline points="225,410 650,410" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="650,410 635.5928463623571,416.9594485457797 635.5928463623571,403.0405514542203" fill="#2165a7"/>
<text x="437.5" y="314" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">1  GET：一覧を開く</text>
<text x="437.5" y="362" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCP・80番ポート</text>
<polyline points="650,570 1160,570" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1160,570 1145.5928463623572,576.9594485457797 1145.5928463623572,563.0405514542203" fill="#16745b"/>
<text x="905.0" y="474" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">2  HTTPでアプリへ転送</text>
<text x="905.0" y="522" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">TCP・8000番ポート</text>
<polyline points="1160,750 1712,750" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1712,750 1697.5928463623572,756.9594485457797 1697.5928463623572,743.0405514542203" fill="#9d651a"/>
<text x="1436" y="644" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">3  SELECT：公開する備品</text>
<text x="1436" y="696" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">TCP・5432番ポート</text>
<polyline points="1712,920 1160,920" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1160,920 1174.4071536376428,913.0405514542203 1174.4071536376428,926.9594485457797" fill="#9d651a"/>
<text x="1436" y="865" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">4  備品の値</text>
<rect x="960" y="1010" width="400" height="100" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="1160" y="1039" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">5  値をHTMLへ組み込む</text>
<polyline points="1160,1270 650,1270" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="650,1270 664.4071536376429,1263.0405514542203 664.4071536376429,1276.9594485457797" fill="#16745b"/>
<polyline points="650,1270 225,1270" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="225,1270 239.40715363764284,1263.0405514542203 239.40715363764284,1276.9594485457797" fill="#2165a7"/>
<rect x="240" y="1150" width="1000" height="90" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="700" y="1165" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">6  HTMLを含むHTTPレスポンス</text>
<rect x="240" y="1320" width="1000" height="90" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="700" y="1340" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">Gunicorn → Nginx → ブラウザ</text>
<text x="55" y="1505" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">番号は本文の1〜6に対応する。ブラウザが接続するのはNginxの入口である。</text>
</svg>