<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img">
<title>HTTPレスポンスを三つの枠に分け、各部分と意味を同じ番号・高さ・背景色・矢印で対応付ける</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="40" dominant-baseline="text-before-edge" text-anchor="start">図4-5  HTTPレスポンスの構成</text>
<text x="75" y="111" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">HTTP/1.1で届いた内容</text>
<text x="1055" y="111" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">各部分の意味</text>
<rect x="40" y="200" width="910" height="160" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<rect x="1050" y="200" width="500" height="160" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="65" y="217" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">① ステータス行</text>
<text x="1075" y="217" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">① 処理の結果</text>
<polyline points="950,280.0 1050,280.0" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1050,280.0 1035.5928463623572,286.9594485457797 1035.5928463623572,273.0405514542203" fill="#2165a7"/>
<rect x="40" y="400" width="910" height="230" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<rect x="1050" y="400" width="500" height="230" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="65" y="417" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">② ヘッダー</text>
<text x="1075" y="417" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">② 本文に関する補足情報</text>
<polyline points="950,515.0 1050,515.0" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1050,515.0 1035.5928463623572,521.9594485457797 1035.5928463623572,508.0405514542203" fill="#16745b"/>
<rect x="40" y="730" width="910" height="150" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<rect x="1050" y="730" width="500" height="150" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="65" y="747" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">③ 本文</text>
<text x="1075" y="747" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">③ 取得したデータ</text>
<polyline points="950,805.0 1050,805.0" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="1050,805.0 1035.5928463623572,811.9594485457797 1035.5928463623572,798.0405514542203" fill="#9d651a"/>
<text x="75" y="278" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="34" dominant-baseline="text-before-edge" text-anchor="start">HTTP/1.1 200 OK</text>
<text x="1075" y="278" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">正常に処理した（200）</text>
<text x="75" y="477" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="start">Content-Type: text/plain</text>
<text x="75" y="535" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="start">Content-Length: 24</text>
<text x="1075" y="477" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">種類：通常のテキスト</text>
<text x="1075" y="535" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">長さ：24バイト</text>
<text x="75" y="664" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">空行（ヘッダーと本文の区切り）</text>
<text x="75" y="805" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">School inventory server</text>
<text x="1075" y="805" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">画面に表示する文章</text>
</svg>