<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img">
<title>備品表の行、列、主キーの位置を示す</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図9-2  行・列・主キーを表から読む</text>
<text x="160" y="175" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">id</text>
<text x="520" y="175" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">name</text>
<text x="980" y="175" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">quantity</text>
<text x="1360" y="175" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">is_public</text>
<rect x="40" y="270" width="1520" height="115" rx="18" fill="#edf7f0" stroke="#16745b" stroke-width="2"/>
<text x="160" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">1</text>
<text x="520" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">Desk</text>
<text x="980" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">6</text>
<text x="1360" y="302" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">true</text>
<rect x="40" y="420" width="1520" height="115" rx="18" fill="#f7f9fc" stroke="#7991aa" stroke-width="2"/>
<text x="160" y="452" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">2</text>
<text x="520" y="452" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">Monitor</text>
<text x="980" y="452" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">1</text>
<text x="1360" y="452" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">false</text>
<rect x="40" y="570" width="1520" height="115" rx="18" fill="#f7f9fc" stroke="#7991aa" stroke-width="2"/>
<text x="160" y="602" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">3</text>
<text x="520" y="602" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">Keyboard</text>
<text x="980" y="602" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">4</text>
<text x="1360" y="602" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">true</text>
<text x="55" y="760" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">横の一行：一件の備品　　縦の一列：名前・数量などの同じ項目</text>
<text x="55" y="832" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">idは一件を区別する主キーの例。画面上の行番号を使うのではない。</text>
</svg>