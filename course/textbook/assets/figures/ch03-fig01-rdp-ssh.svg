<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" role="img">
<title>RDPで踏み台のデスクトップを開き、その端末からSSHでWebへ接続する</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図3-1  踏み台を経由した管理接続</text>
<rect x="25" y="170" width="325" height="275" rx="18" fill="#f5f7fa" stroke="#a9b8c7" stroke-width="2"/>
<text x="188" y="193" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">利用者PC</text>
<text x="188" y="250" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">RDP接続ソフト</text>
<text x="188" y="360" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">画面を表示する</text>
<rect x="390" y="90" width="1170" height="800" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="420" y="109" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="start">AWS</text>
<rect x="450" y="175" width="400" height="155" rx="18" fill="#ffffff" stroke="#16745b" stroke-width="2"/>
<text x="650" y="196" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">Internet Gateway</text>
<text x="650" y="251" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">AWSのIGW</text>
<polyline points="350,300 450,300" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="450,300 435.5928463623572,306.9594485457797 435.5928463623572,293.0405514542203" fill="#16745b"/>
<text x="47" y="482" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">接続先：踏み台の公開IP</text>
<polyline points="650,330 650,520" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="650,520 643.0405514542203,505.5928463623572 656.9594485457797,505.5928463623572" fill="#16745b"/>
<text x="677" y="395" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">RDP / TCP3389</text>
<rect x="450" y="520" width="430" height="240" rx="18" fill="#f1f7f3" stroke="#16745b" stroke-width="2"/>
<text x="665.0" y="532" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="665.0" y="576" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">踏み台サーバー</text>
<text x="665.0" y="632" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">内部IP  10.20.1.10</text>
<text x="665.0" y="688" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">OSユーザー：labuser</text>
<rect x="1070" y="520" width="430" height="240" rx="18" fill="#f1f7f3" stroke="#16745b" stroke-width="2"/>
<text x="1285.0" y="532" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1285.0" y="576" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="1285.0" y="632" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">内部IP  10.20.1.20</text>
<text x="1285.0" y="688" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">OSユーザー：ubuntu</text>
<polyline points="880,675 1070,675" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="1070,675 1055.5928463623572,681.9594485457797 1055.5928463623572,668.0405514542203" fill="#16745b"/>
<text x="975" y="564" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">SSH</text>
<text x="975" y="610" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="middle">TCP22</text>
<text x="460" y="797" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">デスクトップの端末で</text>
<text x="460" y="837" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">lab-ssh webを実行</text>
<text x="1080" y="797" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="start">SSH接続後のコマンドは</text>
<text x="1080" y="837" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">Webで実行される</text>
<text x="40" y="930" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">手元のPCで入力していても、接続後は相手のコンピューターで処理される。</text>
</svg>