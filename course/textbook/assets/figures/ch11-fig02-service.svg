<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>サービスの定義と、起動する対象</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図11-2  サービスの定義と、起動する対象</text>
<text x="55" y="98" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">同じ高さの枠を一組として読む</text>
<rect x="40" y="180" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<rect x="830" y="180" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#2165a7" stroke-width="2"/>
<text x="345" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">User と WorkingDirectory</text>
<text x="1195" y="205" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">OSユーザー catalog</text>
<text x="1195" y="270" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">/opt/jdu-catalog/app</text>
<polyline points="650,268 830,268" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="830,268 815.5928463623571,274.9594485457797 815.5928463623571,261.0405514542203" fill="#2165a7"/>
<rect x="40" y="405" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<rect x="830" y="405" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#16745b" stroke-width="2"/>
<text x="345" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EnvironmentFile</text>
<text x="1195" y="430" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">管理側がroot専用設定を読む</text>
<text x="1195" y="495" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">必要な値をプロセスへ渡す</text>
<polyline points="650,493 830,493" fill="none" stroke="#16745b" stroke-width="4"/><polygon points="830,493 815.5928463623571,499.9594485457797 815.5928463623571,486.0405514542203" fill="#16745b"/>
<rect x="40" y="630" width="610" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<rect x="830" y="630" width="730" height="175" rx="18" fill="#f7f9fc" stroke="#9d651a" stroke-width="2"/>
<text x="345" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">ExecStart と Nginxの転送先</text>
<text x="1195" y="655" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">venv内のGunicornでアプリを実行</text>
<text x="1195" y="720" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">HTTP：127.0.0.1の8000番ポート</text>
<polyline points="650,718 830,718" fill="none" stroke="#9d651a" stroke-width="4"/><polygon points="830,718 815.5928463623571,724.9594485457797 815.5928463623571,711.0405514542203" fill="#9d651a"/>
<text x="55" y="930" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">ユニット読込み、アプリの起動、Nginx設定の反映は対象が異なる。</text>
</svg>