<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img">
<title>WebとDBの送信規則・受信規則と応答の扱い</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図2-3  WebからDBへの接続とSecurity Group</text>
<rect x="60" y="125" width="610" height="505" rx="18" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<rect x="930" y="125" width="610" height="505" rx="18" fill="#f1f7f3" stroke="#a7c2af" stroke-width="2"/>
<text x="365" y="146" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="365" y="189" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="365" y="235" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<text x="1235" y="146" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="26" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1235" y="189" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="1235" y="235" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20</text>
<rect x="95" y="315" width="540" height="220" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="120" y="334" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">SG-Web / 送信規則</text>
<text x="120" y="391" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">宛先：SG-DB</text>
<text x="120" y="439" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">TCP / 宛先ポート5432</text>
<rect x="965" y="315" width="540" height="220" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="990" y="334" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">SG-DB / 受信規則</text>
<text x="990" y="391" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">送信元：SG-Web</text>
<text x="990" y="439" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">TCP / 宛先ポート5432</text>
<polyline points="635,420 965,420" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="965,420 950.5928463623571,426.9594485457797 950.5928463623571,413.0405514542203" fill="#2165a7"/>
<text x="705" y="365" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">接続を開始</text>
<polyline points="965,585 635,585" fill="none" stroke="#16745b" stroke-width="4" stroke-dasharray="13 9"/><polygon points="635,585 649.4071536376429,578.0405514542203 649.4071536376429,591.9594485457797" fill="#16745b"/>
<text x="705" y="535" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="23" dominant-baseline="text-before-edge" text-anchor="start">その接続への応答</text>
<text x="75" y="682" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">接続を始める通信は、送信側と受信側の許可を合わせて考える。</text>
<text x="75" y="736" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">許可された通信への応答はSGが認識する（ステートフル）。</text>
<text x="75" y="789" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">DBの待受とユーザー認証は、SGとは別にPostgreSQLで設定する。</text>
</svg>