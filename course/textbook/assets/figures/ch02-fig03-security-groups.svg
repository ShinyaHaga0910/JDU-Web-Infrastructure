<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img">
<title>オレンジ色のSGと青色のEC2を分けて示すWebとDBの接続</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="35" dominant-baseline="text-before-edge" text-anchor="start">図2-3  WebからDBへの接続とSecurity Group</text>
<text x="900" y="126" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">WebがDBへ接続を開始する：TCP / 宛先ポート5432</text>
<rect x="40" y="220" width="310" height="380" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="195" y="266" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="195" y="323" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバー</text>
<text x="195" y="385" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.1.20</text>
<rect x="1450" y="220" width="310" height="380" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="1605" y="266" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="30" dominant-baseline="text-before-edge" text-anchor="middle">EC2</text>
<text x="1605" y="323" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="middle">DBサーバー</text>
<text x="1605" y="385" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">10.20.2.20</text>
<rect x="420" y="220" width="450" height="380" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="645" y="242" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">Security Group（SG）</text>
<text x="645" y="300" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">SG-Web</text>
<text x="645" y="365" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">送信規則</text>
<text x="645" y="419" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">宛先：SG-DB</text>
<text x="645" y="474" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">TCP / 宛先ポート5432</text>
<rect x="930" y="220" width="450" height="380" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="1155" y="242" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">Security Group（SG）</text>
<text x="1155" y="300" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="middle">SG-DB</text>
<text x="1155" y="365" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">受信規則</text>
<text x="1155" y="419" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">送信元：SG-Web</text>
<text x="1155" y="474" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">TCP / 宛先ポート5432</text>
<polyline points="350,540 420,540" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="420,540 405.5928463623572,546.9594485457797 405.5928463623572,533.0405514542203" fill="#2165a7"/>
<polyline points="870,540 930,540" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="930,540 915.5928463623571,546.9594485457797 915.5928463623571,533.0405514542203" fill="#2165a7"/>
<polyline points="1380,540 1450,540" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="1450,540 1435.5928463623572,546.9594485457797 1435.5928463623572,533.0405514542203" fill="#2165a7"/>
<polyline points="1605,640 195,640" fill="none" stroke="#16745b" stroke-width="4" stroke-dasharray="13 9"/><polygon points="195,640 209.40715363764284,633.0405514542203 209.40715363764284,646.9594485457797" fill="#16745b"/>
<text x="900" y="667" fill="#16745b" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">許可された接続への応答（SGが認識する）</text>
<rect x="75" y="750" width="32" height="32" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="125" y="746" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">青の枠：EC2</text>
<rect x="490" y="750" width="32" height="32" rx="18" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="540" y="746" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">オレンジの枠：通信を許可するSG</text>
<text x="75" y="811" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="start">SG-WebはWebに、SG-DBはDBに関連付ける。図は通信の許可を読む順序を示す。</text>
<text x="75" y="864" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">DBの待受とユーザー認証は、SGとは別にPostgreSQLで設定する。</text>
</svg>