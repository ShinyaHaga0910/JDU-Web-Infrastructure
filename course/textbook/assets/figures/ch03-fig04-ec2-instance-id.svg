<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img">
<title>EC2一覧の画面ガイド。リージョンを選び、Webサーバーの名前と同じ行のインスタンスIDを見る</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="18" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="36" dominant-baseline="text-before-edge" text-anchor="start">図3-4  EC2一覧でインスタンスIDを確認する場所</text>
<rect x="40" y="92" width="1520" height="100" rx="18" fill="#edf5fc" stroke="#7991aa" stroke-width="2"/>
<text x="70" y="116" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">EC2の管理画面</text>
<text x="1170" y="119" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="middle">① リージョン：バージニア北部（us-east-1）</text>
<rect x="40" y="222" width="330" height="285" rx="18" fill="#f8fafc" stroke="#7991aa" stroke-width="2"/>
<text x="70" y="249" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">EC2メニュー</text>
<rect x="65" y="312" width="280" height="126" rx="18" fill="#edf5fc" stroke="#2165a7" stroke-width="2"/>
<text x="205" y="327" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">② インスタンス</text>
<text x="205" y="380" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="middle">Instances</text>
<polyline points="370,372 418,372" fill="none" stroke="#2165a7" stroke-width="4"/><polygon points="418,372 403.5928463623572,378.9594485457797 403.5928463623572,365.0405514542203" fill="#2165a7"/>
<rect x="425" y="222" width="1135" height="327" rx="18" fill="#ffffff" stroke="#7991aa" stroke-width="2"/>
<text x="450" y="242" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="start">インスタンス一覧</text>
<text x="1450" y="247" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="24" dominant-baseline="text-before-edge" text-anchor="middle">（説明用の例）</text>
<rect x="452" y="307" width="1080" height="53" rx="5" fill="#edf5fc" stroke="#9ebed8" stroke-width="2"/>
<text x="482" y="314" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">名前（Name）</text>
<text x="910" y="314" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">インスタンス ID（Instance ID）</text>
<text x="502" y="374" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">example-lab-bastion</text>
<text x="930" y="374" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">i-00000000000000001</text>
<rect x="452" y="422" width="1080" height="48" rx="5" fill="#fff3df" stroke="#9d651a" stroke-width="2"/>
<text x="460" y="427" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="25" dominant-baseline="text-before-edge" text-anchor="start">③</text>
<text x="502" y="427" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">example-lab-web</text>
<text x="930" y="427" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">i-00000000000000002</text>
<text x="502" y="480" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">example-lab-db</text>
<text x="930" y="480" fill="#2165a7" font-family="Noto Sans JP, sans-serif" font-size="29" dominant-baseline="text-before-edge" text-anchor="start">i-00000000000000003</text>
<text x="450" y="573" fill="#9d651a" font-family="Noto Sans JP, sans-serif" font-size="27" dominant-baseline="text-before-edge" text-anchor="start">③ 名前の末尾でWebサーバーを探し、同じ行の i- から始まるIDをコピーする。</text>
</svg>