<text x="2070.0" y="1488" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">5432番ポートへの接続は</text>
<text x="2070.0" y="1544" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">Webサーバーからだけ</text>
