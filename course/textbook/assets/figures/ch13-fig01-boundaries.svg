<text x="55" y="1845" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="32" dominant-baseline="text-before-edge" text-anchor="start">紫の枠：EC2に関連付けたSG　　吹き出し：その場所でのアクセス制御　　矢印：利用する通信</text>
