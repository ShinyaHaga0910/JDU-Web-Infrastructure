<circle cx="850" cy="1480" r="15" fill="#fff9e9" stroke="#7354a0" stroke-width="2"/>
<rect x="430" y="1520" width="630" height="235" rx="36" fill="#fff9e9" stroke="#7354a0" stroke-width="2"/>
<text x="745.0" y="1543" fill="#7354a0" font-family="Noto Sans JP, sans-serif" font-size="31" dominant-baseline="text-before-edge" text-anchor="middle">通信：SG-Bastion（AWS）</text>
<text x="745.0" y="1608" fill="#193047" font-family="Noto Sans JP, sans-serif" font-size="28" dominant-baseline="text-before-edge" text-anchor="middle">RDPは許可した接続元のみ</text>
