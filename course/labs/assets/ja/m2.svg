<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>M2</title><desc>M2: IP指定のHTTPが使える → DNSとresolverを設定する → 名前でも同じWebへ届く。 図の太枠が今回の主な対象です。設定操作は各手順の実行場所で行い、図の矢印は接続・確認の向きを表します。 SGの通信許可は初期配備済みで、今回の課題はサーバー内の設定です。 図を参考に完成要件から設定値を自分で決めます。</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">M2 · いま何をしているか</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">開始時点</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">IP指定のHTTPが使える</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">今回の操作</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">DNSとresolverを設定する</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">確認する結果</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">名前でも同じWebへ届く</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#587083">太枠：今回の主な設定・確認対象</text><rect x="56" y="270" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="151.0" y="296" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="151.0" y="322" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">踏み台サーバ</text><text x="151.0" y="346" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.1.10</text><rect x="56" y="480" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="151.0" y="506" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="151.0" y="532" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">Webサーバ</text><text x="151.0" y="556" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.1.20</text><rect x="770" y="270" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="865.0" y="296" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="865.0" y="322" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">DNSサーバ</text><text x="865.0" y="346" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.2.10</text><rect x="770" y="490" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="865.0" y="527" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">VPC DNS</text><polyline points="246,307 770,307" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="770.00,307.00 759.19,312.22 759.19,301.78" fill="#126e70"/><rect x="426.5" y="271" width="163.0" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="508" y="289" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">DNS / UDP + TCP 53</text><polyline points="151,356 151,480" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="151.00,480.00 145.78,469.19 156.22,469.19" fill="#126e70"/><rect x="90.75" y="408" width="120.5" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text