<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>P0</title><desc>P0: 5台は初期配備済み → 本人・接続先を確かめる → 正しい役割へSSMで入る。 図の太枠が今回の主な対象です。設定操作は各手順の実行場所で行い、図の矢印は接続・確認の向きを表します。 SGの通信許可は初期配備済みで、今回の課題はサーバー内の設定です。 SSMの矢印はAWSの接続管理を使う経路で、EC2の443番受信を開く指示ではありません。</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">P0 · いま何をしているか</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">開始時点</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">5台は初期配備済み</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">今回の操作</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">本人・接続先を確かめる</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">確認する結果</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">正しい役割へSSMで入る</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#587083">太枠：今回の主な設定・確認対象</text><rect x="56" y="264" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="151.0" y="301" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">学生PC</text><ellipse cx="525.0" cy="296.5" rx="95.0" ry="32.5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="525.0" y="301" font-size="19" fon