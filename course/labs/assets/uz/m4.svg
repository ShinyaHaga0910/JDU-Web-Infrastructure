<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>M4</title><desc>M4: Web dan DB ulanishini tayyorlash → DB, role va auth ni sozlash → Ruxsatli SELECT muvaffaqiyatli。 Qalin ramka asosiy obyektni bildiradi. Har qadamdagi terminalda sozlang; strelkalar ulanish yoki tekshirish yo‘nalishidir. SG ruxsatlari boshlang‘ich tarqatmada tayyor; bu topshiriqda server ichini sozlaysiz. CloudShell dan DB serverga SSM orqali ulanib, sozlang. Diagrammaga qarab talablardan sozlama qiymatlarini mustaqil tanlang.</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">M4 · Hozir nima qilamiz</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Boshlanish</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Web dan DB ulanishini</text><text x="36" y="144" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">tayyorlash</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Hozirgi amal</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">DB, role va auth ni sozlash</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Tekshiriladigan natija</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Ruxsatli SELECT muvaffaqiyatli</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18"