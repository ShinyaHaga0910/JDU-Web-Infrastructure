<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>M5</title><desc>M5: DNS va DB tayyor → Tayyor app ni ulash va yoqish → Amal natijasi DB va Web da。 Qalin ramka asosiy obyektni bildiradi. Har qadamdagi terminalda sozlang; strelkalar ulanish yoki tekshirish yo‘nalishidir. SG ruxsatlari boshlang‘ich tarqatmada tayyor; bu topshiriqda server ichini sozlaysiz. 8000 faqat Web ichida; 8080 bastiondan boshqarish uchun. Chapda Internet, o‘ngdagi ramka AWS VPC sidir. IGW VPC chegarasida; barcha EC2, jumladan bastion, AWS tomonida. Diagrammaga qarab talablardan sozlama qiymatlarini mustaqil tanlang.</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">M5 · Hozir nima qilamiz</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Boshlanish</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">DNS va DB tayyor</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Hozirgi amal</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Tayyor app ni ulash va yoqish</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Tekshiriladigan natija</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Amal natijasi DB va Web da</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18" font-family="Arial,