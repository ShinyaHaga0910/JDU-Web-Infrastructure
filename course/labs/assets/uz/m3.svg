<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>M3</title><desc>M3: Ayni Web ning asl diski → Qayd → Stop → Start → Mazmun saqlangan, boot ID yangi。 Qalin ramka asosiy obyektni bildiradi. Har qadamdagi terminalda sozlang; strelkalar ulanish yoki tekshirish yo‘nalishidir. SG ruxsatlari boshlang‘ich tarqatmada tayyor; bu topshiriqda server ichini sozlaysiz. Stop/Start AWS API boshqaruvidir; Web kiruvchi 443 portini ochish emas. Diagrammaga qarab talablardan sozlama qiymatlarini mustaqil tanlang.</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">M3 · Hozir nima qilamiz</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Boshlanish</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Ayni Web ning asl diski</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Hozirgi amal</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Qayd → Stop → Start</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Tekshiriladigan natija</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Mazmun saqlangan, boot ID</text><text x="712" y="144" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">yangi</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#587083">Qalin ramka: sozlash yoki tekshirish obyekti</text><rect x="56" y="280" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="151.0" y="317" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">AWS Console</text><rect x="430" y="270" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="525.0" y="296" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="525.0" y="322" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">Web server</text><text x="525.0" y="346" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.1.20</text><rect x="782" y="280" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="877.0" y="317" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EBS (root)</text><polyline points="246,312 430,312" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="430.00,312.00 419.19,317.22 419.19,306.78" fill="#126e70"/><rect x="276.51171875" y="276" width="122.9765625" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="338" y="294" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">AWS API / 443</text><polyline points="620,312 782,312" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="782.00,312.00 771.19,317.22 771.19,306.78" fill="#126e70"/><rect x="662.75390625" y="276" width="78.4921875" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="702" y="294" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">Ayni disk</text><rect x="80" y="464" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="175.0" y="501" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">running</text><rect x="430" y="464" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="525.0" y="501" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">stopped</text><rect x="780" y="464" width="190" height="65" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="875.0" y="501" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">running</text><polyline points="270,496 430,496" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="430.00,496.00 419.19,501.22 419.19,490.78" fill="#126e70"/><rect x="327.5" y="460" width="45.0" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="350" y="478" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">Stop</text><polyline points="620,496 780,496" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="780.00,496.00 769.19,501.22 769.19,490.78" fill="#126e70"/><rect x="677.25" y="460" width="45.5" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="700" y="478" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">Start</text><text x="520" y="593" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">Asl instance, volume va ayni marker ni solishtirish</text><text x="26" y="658" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Keyingi: P4</text></svg>
