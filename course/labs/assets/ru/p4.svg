<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img"><title>P4</title><desc>P4: Подготовить доступ Web к БД → Настроить БД, роли и вход → Разрешённый SELECT успешен。 Толстая рамка отмечает основной объект. Настраивайте в терминале, указанном в шаге; стрелки показывают направление подключения или проверки. Разрешения SG заданы начальным комплектом; здесь настраивается сервер. Подключитесь из CloudShell к DB через SSM и настройте сервер.</desc><rect width="1040" height="680" fill="white"/><text x="24" y="36" font-size="24" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">P4 · Что мы сейчас делаем</text><rect x="24" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="36" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">В начале</text><text x="36" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Подготовить доступ Web к БД</text><rect x="362" y="60" width="316" height="112" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="1"/><text x="374" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Сейчас</text><text x="374" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Настроить БД, роли и вход</text><rect x="700" y="60" width="316" height="112" rx="5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="712" y="85" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Результат</text><text x="712" y="116" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">Разрешённый SELECT</text><text x="712" y="144" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#18354c">успешен</text><rect x="24" y="194" width="992" height="426" rx="5" fill="white" stroke="#d8e1e8" stroke-width="1"/><text x="44" y="222" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#587083">Толстая рамка: объект настройки или проверки</text><rect x="66" y="280" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="161.0" y="306" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="161.0" y="332" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">Web-сервер</text><text x="161.0" y="356" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.1.20</text><rect x="770" y="280" width="190" height="86" rx="5" fill="#e7f4f2" stroke="#126e70" stroke-width="3"/><text x="865.0" y="306" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">EC2</text><text x="865.0" y="332" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">DB-сервер</text><text x="865.0" y="356" font-size="14" font-family="Arial,MS Gothic,sans-serif" fill="#587083" text-anchor="middle">10.20.2.20</text><polyline points="256,320 770,320" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="770.00,320.00 759.19,325.22 759.19,314.78" fill="#126e70"/><rect x="413.51171875" y="279" width="192.9765625" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="510" y="297" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">PostgreSQL / TCP 5432</text><text x="520" y="410" font-size="21" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">SELECT / SCRAM</text><ellipse cx="161.0" cy="520.5" rx="95.0" ry="32.5" fill="#f4f7fa" stroke="#d8e1e8" stroke-width="1"/><text x="161.0" y="525" font-size="19" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">CloudShell</text><polyline points="256,520 660,520 660,348 770,348" fill="none" stroke="#126e70" stroke-width="2.5"/><polygon points="770.00,348.00 759.19,353.22 759.19,342.78" fill="#126e70"/><rect x="483.5" y="487" width="47.0" height="25" rx="5" fill="white" stroke="white" stroke-width="1"/><text x="507" y="505" font-size="17" font-family="Arial,MS Gothic,sans-serif" fill="#126e70" text-anchor="middle">SSM</text><text x="520" y="588" font-size="18" font-family="Arial,MS Gothic,sans-serif" fill="#18354c" text-anchor="middle">Разрешить только Web /32 и нужные DB/role</text><text x="26" y="658" font-size="20" font-family="Arial,MS Gothic,sans-serif" fill="#126e70">Далее: M3</text></svg>
