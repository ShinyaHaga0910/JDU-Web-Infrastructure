# Web server only. Disable the package's default site before enabling this file.
# Keep the public listener and the private administrator listener separate.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/jdu-catalog-public.access.log;
    error_log /var/log/nginx/jdu-catalog-public.error.log;

    location = /practice.txt { root /var/www/html; try_files $uri =404; }
    location = /mission.txt { root /var/www/html; try_files $uri =404; }

    location ~ ^/admin(?:/|$) { return 404; }
    location /static/ {
        alias /var/lib/jdu-catalog/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-JDU-Entry public;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 10.20.1.20:8080;
    server_name admin.lab.test;
    server_tokens off;
    client_max_body_size 32k;
    allow 10.20.1.10;
    deny all;
    access_log /var/log/nginx/jdu-catalog-admin.access.log;
    error_log /var/log/nginx/jdu-catalog-admin.error.log;

    location /static/ {
        alias /var/lib/jdu-catalog/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-JDU-Entry admin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
